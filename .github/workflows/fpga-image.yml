name: Build FPGA SD image

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fpga-image.yml"
      - "ci-tools/fpga-image/**"

  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fpga-image.yml"
      - "ci-tools/fpga-image/**"

  schedule:
    # 5:13 AM PST tuesday, thursday
    - cron: '13 13 * * 2,4'

  workflow_call:
    inputs:
      branch:
        default: ${{ github.sha }}
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  GCS_NIX_CACHE_BUCKET: gs://caliptra-github-ci-caliptra-reports/nix-cache
  GCS_NIX_CACHE_URL: https://storage.googleapis.com/caliptra-github-ci-caliptra-reports/nix-cache

jobs:
  build_sd_image:
    runs-on: ubuntu-24.04-arm
    outputs:
      cache_updated: ${{ steps.export_cache.outputs.cache_updated }}
    strategy:
      matrix:
        include:
          - image_variant: core
            flake_prefix: vck190-core
          - image_variant: subsystem
            flake_prefix: vck190-subsystem
          - image_variant: zcu104
            flake_prefix: zcu104
    env:
      IMAGE_VARIANT: ${{ matrix.image_variant }}
      FLAKE_PREFIX: ${{ matrix.flake_prefix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-substituters = ${{ env.GCS_NIX_CACHE_URL }}?trusted=1
            require-sigs = false

      - name: Build Dev and CI SD card images in Nix
        run: |
          cd ci-tools/fpga-image
          mkdir -p out

          mapfile -t OUT_PATHS < <(
            nix build -L \
              "path:.#${FLAKE_PREFIX}-dev" \
              "path:.#${FLAKE_PREFIX}-ci" \
              --no-link --print-out-paths
          )
          cp -f --sparse=always "${OUT_PATHS[0]}/dev-image.img" dev-image.img
          cp -f "${OUT_PATHS[1]}/image.img" out/image.img

      - name: Export newly built boot firmware and kernel store paths on cache miss
        id: export_cache
        run: |
          cd ci-tools/fpga-image
          if [ "${IMAGE_VARIANT}" = "zcu104" ]; then
            TARGETS=(
              "path:.#zcu104-system-boot"
              "path:.#zcu104-kernel-modules"
              "path:.#fpga-healthd"
            )
          else
            TARGETS=(
              "path:.#bootgen"
              "path:.#arm-trusted-firmware"
              "path:.#u-boot-xlnx"
              "path:.#boot-bin-${IMAGE_VARIANT}"
              "path:.#system-dtb-${IMAGE_VARIANT}"
              "path:.#linux-xlnx"
              "path:.#fpga-healthd"
            )
          fi
          if nix path-info --store "${GCS_NIX_CACHE_URL}" "${TARGETS[@]}" >/dev/null 2>&1; then
            echo "All kernel and boot firmware store paths are already cached in ${GCS_NIX_CACHE_BUCKET}."
          else
            echo "Cache miss detected; exporting store paths for GCS upload..."
            mkdir -p /tmp/nix-fpga-cache
            nix copy --to "file:///tmp/nix-fpga-cache?compression=zstd" "${TARGETS[@]}"
            echo "cache_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Nix cache bundle artifact
        if: steps.export_cache.outputs.cache_updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nix-fpga-cache-${{ matrix.image_variant }}
          path: /tmp/nix-fpga-cache
          retention-days: 1

      - name: Upload dev-image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: caliptra-fpga-image-${{ matrix.image_variant }}-dev
          path: ci-tools/fpga-image/dev-image.img
          retention-days: 90

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: caliptra-fpga-image-${{ matrix.image_variant }}
          path: ci-tools/fpga-image/out/image.img
          retention-days: 90

  upload_nix_cache:
    runs-on: e2-standard-2-reporter
    needs: [build_sd_image]
    if: needs.build_sd_image.outputs.cache_updated == 'true'
    steps:
      - name: Download Nix cache bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nix-fpga-cache-*
          merge-multiple: true
          path: /tmp/nix-fpga-cache

      - name: Sync Nix cache to GCS
        run: |
          export PATH="$PATH:/snap/bin"
          gcloud storage rsync --recursive /tmp/nix-fpga-cache "${GCS_NIX_CACHE_BUCKET}"
